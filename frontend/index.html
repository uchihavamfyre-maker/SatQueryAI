<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SatQuery AI — SIH26167</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
    * { 
        box-sizing:0 ;
        border-box:0; 
        margin: 0;
        padding: 0; 
    }
    body { 
        
        background-image:linear-gradient(white,rgb(2, 19, 83));
        height: 100vh; 
        display:flex;
        flex-direction: column;
    }
    header {
      background-color :#021131;
      display:flex;
      justify-content: center;
      gap:12px;
      flex-shrink:0;
      padding:20px
    }
    header h1 
    { 
      font-family: "Bebas Neue", sans-serif;
      font-weight: 50px;
      font-style: normal;
      font-size: 40px;
      color:rgb(240, 240, 236);
      text-shadow: 2px 2px 4px rgb(81, 148, 248);
      display:flex;
      justify-content: center;

    }
    header p  {
         font-weight:100px;
         font-size: 20px;
         color: #89bff5;
         margin-top: 2px;
         }
    .layout {
        display: grid;
        grid-template-columns: 700px 1fr;
        flex: 1; 
        overflow: hidden;
        height:680px ; 
        }
    .sidebar {
         display: flex;
         flex-direction: column;
         gap: 50px;
         padding: 50px; 
         overflow-y: auto; 
         border-right: 4px solid #101437; 
         background: #e3eef9; 
        }
    .map-area { 
        padding: 14px; 
        background-image:linear-gradient(rgb(226, 231, 249),rgb(52, 52, 152),rgb(23, 23, 84)); 
    }
    #map { 
        width: 100%; 
        height: 100%; 
        border-radius: 10px;
    }
    .section-title {
         font-size: 25px; 
         font-weight: 500;
         color: #02397c;
         text-transform: uppercase;
         letter-spacing: 1px;
         margin-bottom: 5px;
             }
    .dropzone {
        border: 2px dashed #032b64;
        border-radius: 10px; 
        padding: 20px;
        width:400px ;
        height:150px;
        text-align: center;
        cursor: pointer;
        background: #c5e5f2;
     }
    .dropzone:hover {
        
        background: #5785f0d7;
     }
    .dropzone .icon {
         font-size: 30px; 
         margin-bottom: 6px; 
         display:flex;
         justify-content: center;
        }

        .dropzone p { 
            margin-top: 30px;
            display:flex;
            justify-content: center;
        font-size: 15px; 
        color: #000714; 
    }
    .dropzone small { 
        display:flex;
        justify-content: center;
        font-size: 15px;
         color: hsl(224, 78%, 60%);
         }
    .img-row { 
        display: flex; 
        align-items: center;
        gap: 8px;
        background: #c8daef; 
        border: 1px solid #093284;
        border-radius: 8px;
         padding: 8px 10px; 
        }
    .img-thumb { 
        width: 44px;
        height: 44px;
        object-fit: cover;
        border-radius: 5px;
        background: #e2e9f6;
        display: flex; 
        align-items: center; 
        justify-content: center;
         font-size: 10px; color: #9ca3af; 
         flex-shrink: 0; }
    .img-info {
         flex: 1;
          min-width: 0;
         }
    .img-info .name {
         font-size: 12px; 
         font-weight: 600; 
         white-space: nowrap;
         overflow: hidden;
         text-overflow:
         ellipsis;
         }
    .img-info .meta { 
        font-size: 10px;
         color: #d5d8dd; 
        }
    select { 
        font-size: 11px;
         border: 1px solid #d1d5db;
          border-radius: 4px;
           padding: 2px 4px; 
           background: #fff; 
        }
    .remove-btn { 
        background: none; 
        border: none; 
        cursor: pointer;
        color: #380a02; 
        font-size: 18px;
        line-height: 1;
        padding: 0 2px; 
        }
    .remove-btn:hover {
         color: #ef4444; 
        }
    .query-row {
         display: flex; 
         gap: 6px; 
        }
    .query-input {
         flex: 1; 
         padding: 9px 12px;
         font-size: 13px;
         border: 1px solid #011829;
         border-radius: 8px;
         outline: none;
             }
    .query-input:focus {
         border-color: #5cbdee;
         border-width: 3px;
         }
    .run-btn { 
        padding: 9px 16px;
         background: #012651; 
         color: #08b5fa;
          border: none; 
          border-radius: 8px; 
          font-size: 13px; 
          font-weight: 600; 
          cursor: pointer; 
          white-space: nowrap; 
        }
    .run-btn:disabled {
        color: white;
         background: #516c707e;
         cursor: not-allowed;
         }
    .examples { 
        display: flex; 
        flex-wrap: wrap;
        gap: 13px; 
        margin-top: 10px; 
        color: #032b64;
    }
    .ex-btn { 
        font-size: 13px; 
        padding: 3px 8px; 
        background: #a9d0ea; 
        border: 1px solid #bae6fd;
        border-radius: 20px; 
        color: #131313; 
        cursor: pointer;
     }
    .ex-btn:hover { 
        background: #8da7b9;
     }
    .card {
         background: #daf3fb;
         border: 1px solid #010535; 
         border-radius: 10px;
         padding: 12px 14px; 
         
         width:500px;
        }
    .card.error {
         border-color: #66779d;
          background: #090514; 
        }
    .answer-text {
         font-size: 20px; 
         line-height: 1.6;
         color: #111827;
         margin-top: 5px; 
        }
    .confidence {
        font-size: 13px;
        font-weight: 650;
        padding: 2px 8px;
        border-radius: 10px;
        border-color: 2px #000714;
        
         }
    .conf-high { 
        color: #c2efac;
        background: #045d23; 
    }
    .conf-mid  { 
        color: #ecd7c0; 
        background: #715b03; }
    .conf-low  {
         color: #f6adad;
         background: #450202;
         }
    .task-label { 
        font-size: 18px;
        font-weight: 650px; 
        color: #142aa3; 
        text-transform: uppercase; 
        letter-spacing: 1px; }
    .top-row {
        display: flex; 
        justify-content: space-between; 
        align-items: center;
        margin-bottom: 6px;
     }
    .region-row { 
        display: flex; 
        justify-content: space-between; 
        font-size: 12px; 
        padding: 3px 0;
        border-bottom: 1px solid #f3f4f6;
     }
    .region-row:last-child { 
        border-bottom: none; }
    .tag {
         font-size: 14px; 
         padding: 2px 7px; 
         background: #f0f9ff;
         border: 1px solid #bae6fd;
         border-radius: 20px;
         color: #0369a1; 
        }
    .tags {
         display: flex;
         flex-wrap: wrap; 
         gap: 5px;
         }
    .trace-toggle {
         background: none;
          border: 1px solid #e5e7eb;
          border-radius: 8px;
          padding: 7px 12px;
          font-size: 15px; 
          color: #2b3d61; 
          cursor: pointer; 
          width: 100%; text-align: left; }
    .trace-box {
         background: #0f172a;
         border-radius: 8px; 
         padding: 12px;
         overflow-x: auto; }
    .trace-box pre {
         font-size: 10px; 
         color: #f4cba0;
         white-space: pre-wrap;
         word-break: break-all;
         }
    .status-row {
         display: flex; 
         align-items: center;
         gap: 10px; }
    .spinner {
         width: 18px;
         height: 18px; 
         border: 2px solid #aed7f2;
         border-top-color: #052d68;
         border-radius: 50%; 
         animation: spin 0.8s linear infinite;
         flex-shrink: 0; }
    @keyframes spin {
         to {
             transform: rotate(360deg); 
            } 
        }
    .map-placeholder { 
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(249, 247, 246, 0.85);
        border-radius: 10px;
        pointer-events: none; 
    }
    .upload-progress { 
        font-size: 20px;
         color: #05346f;
         }
    .err-text {
        display:flex;
        background-color: #13194a;
        padding:10px;
         font-size: 20px; 
         color: #ef0808;
        border-radius:50px }

  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const API = "http://127.0.0.1:8000";

const ROLES = ["PRIMARY","T1","T2","OPTICAL","SAR"];
const EXAMPLES = [
  "What land cover type dominates this image?",
  "Describe the scene in this satellite image.",
  "Locate all water bodies in this image.",
  "What changed between these two images?",
  "Did urban area expand between T1 and T2?",
  "Identify built-up areas and water regions using both images.",
];
const TASK_LABELS = {
  SINGLE_VQA:"Visual Q&A", SINGLE_CAPTION:"Scene Caption",
  SINGLE_GROUNDING:"Region Grounding", BITEMPORAL_CHANGE_DETECT:"Change Detection",
  BITEMPORAL_CHANGE_VQA:"Change Q&A", CROSS_MODAL_ANALYSIS:"Optical+SAR Analysis",
};

function uuid() {
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random()*16|0, v = c==="x"?r:(r&0x3|0x8);
    return v.toString(16);
  });
}

async function apiFetch(path, opts={}) {
  const res = await fetch(API + path, opts);
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`${res.status}: ${txt}`);
  }
  return res.json();
}

async function uploadFile(file) {
  const fd = new FormData();
  fd.append("file", file);
  return apiFetch("/upload", { method:"POST", body:fd });
}

async function submitQuery(jobId, query, imageRoles) {
  return apiFetch("/query", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ job_id:jobId, query, image_roles:imageRoles }),
  });
}

async function pollJob(jobId, onStatus) {
  const deadline = Date.now() + 300000;
  while (Date.now() < deadline) {
    const s = await apiFetch(`/job/${jobId}/status`);
    onStatus(s);
    if (s.status === "COMPLETED" || s.status === "FAILED") {
      return apiFetch(`/job/${jobId}/result`);
    }
    await new Promise(r => setTimeout(r, 1500));
  }
  throw new Error("Job timed out");
}

// ── Map component ─────────────────────────────────────────────────────────────
function MapView({ evidence }) {
  const ref = useRef(null);
  const mapRef = useRef(null);

  useEffect(() => {
    if (!ref.current) return;
    if (!mapRef.current) {
      mapRef.current = L.map(ref.current, { center:[20.5937,78.9629], zoom:5 });
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution:"© OpenStreetMap contributors", maxZoom:19
      }).addTo(mapRef.current);
    }
    const map = mapRef.current;

    // Clear old layers except tile layer
    map.eachLayer(l => { if (!(l instanceof L.TileLayer)) map.removeLayer(l); });

    if (!evidence) return;

    const geoRegions = (evidence.detected_regions||[]).filter(r => r.bbox_geo);
    if (geoRegions.length > 0) {
      const bounds = [];
      geoRegions.forEach(r => {
        const b = r.bbox_geo;
        const rect = L.rectangle([[b.miny,b.minx],[b.maxy,b.maxx]], {
          color:"#0ea5e9", weight:2, fillOpacity:0.15
        }).bindTooltip(`${r.label}${r.score ? " ("+Math.round(r.score*100)+"%)" : ""}`);
        rect.addTo(map);
        bounds.push([b.miny,b.minx],[b.maxy,b.maxx]);
      });
      if (bounds.length) map.fitBounds(bounds, {padding:[40,40]});
    }

    const overlayFile = evidence.change_map_path || evidence.overlay_path;
    if (overlayFile && geoRegions.length > 0) {
      const b = geoRegions[0].bbox_geo;
      const fname = overlayFile.split(/[\\/]/).pop();
      L.imageOverlay(`${API}/results/${fname}`, [[b.miny,b.minx],[b.maxy,b.maxx]], {opacity:0.65}).addTo(map);
    }
  }, [evidence]);

  return (
    <div style={{position:"relative", width:"100%", height:"100%"}}>
      <div ref={ref} style={{width:"100%",height:"100%",borderRadius:10}} />
      {!evidence && (
        <div className="map-placeholder">
          <div style={{fontSize:36}}>🛰️</div>
          <p style={{marginTop:8,fontSize:13,color:"#6b7280"}}>Georeferenced overlays appear here after analysis</p>
        </div>
      )}
    </div>
  );
}

// ── Confidence badge ──────────────────────────────────────────────────────────
function ConfBadge({ v }) {
  const pct = Math.round(v*100);
  const cls = pct>=70?"conf-high":pct>=40?"conf-mid":"conf-low";
  return <span className={`confidence ${cls}`}>{pct}% confidence</span>;
}

// ── Results panel ─────────────────────────────────────────────────────────────
function Results({ result, status, progress }) {
  const [showTrace, setShowTrace] = useState(false);

  if (!result && !["VALIDATING","PLANNING","RUNNING","FUSING"].includes(status)) return null;

  if (["VALIDATING","PLANNING","RUNNING","FUSING"].includes(status)) {
    return (
      <div className="card">
        <div className="status-row">
          <div className="spinner" />
          <div>
            <div style={{fontSize:13,fontWeight:600}}>{status}</div>
            <div style={{fontSize:11,color:"#6b7280"}}>{progress}</div>
          </div>
        </div>
      </div>
    );
  }

  if (status === "FAILED") {
    return (
      <div className="card error">
        <div style={{fontWeight:600,color:"#dc2626",fontSize:13}}>Analysis failed</div>
        <div style={{fontSize:12,color:"#6b7280",marginTop:4}}>{result?.error || "Unknown error"}</div>
      </div>
    );
  }

  if (!result?.evidence) return null;
  const ev = result.evidence;

  return (
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      {/* Answer */}
      <div className="card">
        <div className="top-row">
          <span className="task-label">{TASK_LABELS[ev.task] || ev.task}</span>
          <ConfBadge v={ev.confidence} />
        </div>
        <div className="answer-text">{ev.answer}</div>
        {ev.confidence_rationale && (
          <div style={{fontSize:10,color:"#9ca3af",marginTop:6}}>{ev.confidence_rationale}</div>
        )}
      </div>

      {/* Detected regions */}
      {ev.detected_regions?.length > 0 && (
        <div className="card">
          <div className="section-title">Detected Regions</div>
          {ev.detected_regions.map((r,i) => (
            <div className="region-row" key={i}>
              <span style={{fontWeight:500,textTransform:"capitalize"}}>{r.label}</span>
              <span style={{color:"#6b7280",fontSize:11}}>
                {r.area_km2 != null ? `${r.area_km2.toFixed(2)} km²  ` : ""}
                {r.score > 0 ? `${Math.round(r.score*100)}%` : ""}
              </span>
            </div>
          ))}
        </div>
      )}

      {/* Spatial outputs */}
      {(ev.change_map_path || ev.overlay_path) && (
        <div className="card">
          <div className="section-title">Spatial Outputs</div>
          {ev.change_map_path && <div style={{fontSize:12,color:"#0284c7"}}>📍 Change map — visible on map</div>}
          {ev.overlay_path    && <div style={{fontSize:12,color:"#0284c7",marginTop:3}}>🗺 Segmentation overlay — visible on map</div>}
        </div>
      )}

      {/* Models used */}
      <div className="card">
        <div className="section-title">Models Used</div>
        <div className="tags">
          {ev.models_used?.map(m => <span className="tag" key={m}>{m.split(":")[0]}</span>)}
        </div>
      </div>

      {/* Trace */}
      <button className="trace-toggle" onClick={() => setShowTrace(v => !v)}>
        {showTrace ? "▲ Hide" : "▼ Show"} execution trace
      </button>
      {showTrace && ev.execution_plan && (
        <div className="trace-box">
          <pre>{JSON.stringify(ev.execution_plan, null, 2)}</pre>
        </div>
      )}
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [images, setImages]       = useState([]);
  const [query, setQuery]         = useState("");
  const [running, setRunning]     = useState(false);
  const [uploading, setUploading] = useState(false);
  const [jobStatus, setJobStatus] = useState(null);
  const [result, setResult]       = useState(null);
  const [error, setError]         = useState(null);
  const fileRef = useRef(null);

  const handleFiles = useCallback(async (files) => {
    setError(null);
    setUploading(true);
    const added = [];
    for (const file of Array.from(files)) {
      try {
        const resp = await uploadFile(file);
        const previewUrl = file.type.startsWith("image/") ? URL.createObjectURL(file) : null;
        const role = resp.detected_modality === "SAR" ? "SAR"
                   : images.length + added.length === 0 ? "PRIMARY"
                   : images.length + added.length === 1 ? "T2" : "PRIMARY";
        added.push({
          uploadId: resp.upload_id,
          filename: resp.filename,
          modality: resp.detected_modality,
          format:   resp.detected_format,
          role,
          previewUrl,
          meta: resp.quick_metadata,
        });
      } catch(e) {
        setError(`Upload failed for ${file.name}: ${e.message}`);
      }
    }
    setImages(prev => [...prev, ...added]);
    setUploading(false);
  }, [images]);

  const onDrop = useCallback(e => {
    e.preventDefault();
    if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  }, [handleFiles]);

  const runQuery = async () => {
    if (!query.trim()) { setError("Enter a query."); return; }
    if (images.length === 0) { setError("Upload at least one image."); return; }
    setError(null); setResult(null); setRunning(true); setJobStatus(null);
    const jobId = uuid();
    const imageRoles = {};
    images.forEach(img => { imageRoles[img.uploadId] = img.role; });
    try {
      await submitQuery(jobId, query.trim(), imageRoles);
      const final = await pollJob(jobId, s => setJobStatus(s));
      setResult(final);
      setJobStatus(s => s ? {...s, status: final.status} : null);
    } catch(e) {
      setError(e.message);
    } finally {
      setRunning(false);
    }
  };

  const currentStatus = jobStatus?.status || (running ? "RUNNING" : "IDLE");
  const progress = jobStatus?.progress_message || "";

  return (
    <>
      <header>
        <span style={{fontSize:22}}>🛰️</span>
        <div>
          <h1>SatQuery AI</h1>
          <p>Agentic Vision-Language Assistant for Remote Sensing · SIH26167</p>
        </div>
      </header>

      <div className="layout">
        {/* ── Sidebar ── */}
        <div className="sidebar">

          {/* Images */}
          <div>
            <div className="section-title">Images</div>
            <div
              className="dropzone"
              onDrop={onDrop}
              onDragOver={e => e.preventDefault()}
              onClick={() => fileRef.current?.click()}
            >
              <div className="icon">📡</div>
              <p>Drop <strong>GeoTIFF / PNG / JPEG</strong> or <span style={{color:"#0284c7"}}>browse</span></p>
              <small>GeoTIFF required for bi-temporal &amp; cross-modal tasks</small>
              <input ref={fileRef} type="file" multiple accept=".tif,.tiff,.png,.jpg,.jpeg"
                style={{display:"none"}} onChange={e => e.target.files && handleFiles(e.target.files)} />
            </div>

            {uploading && <div className="upload-progress" style={{marginTop:6}}>Uploading…</div>}

            {images.map(img => (
              <div className="img-row" key={img.uploadId} style={{marginTop:8}}>
                {img.previewUrl
                  ? <img src={img.previewUrl} className="img-thumb" alt="" />
                  : <div className="img-thumb">{img.format}</div>
                }
                <div className="img-info">
                  <div className="name">{img.filename}</div>
                  <div className="meta">
                    {img.modality} · {img.format}
                    {img.meta?.bands ? ` · ${img.meta.bands}b` : ""}
                    {img.meta?.width ? ` · ${img.meta.width}×${img.meta.height}` : ""}
                  </div>
                </div>
                <select value={img.role}
                  onChange={e => setImages(prev => prev.map(i =>
                    i.uploadId === img.uploadId ? {...i, role: e.target.value} : i
                  ))}>
                  {ROLES.map(r => <option key={r} value={r}>{r}</option>)}
                </select>
                <button className="remove-btn"
                  onClick={() => setImages(prev => prev.filter(i => i.uploadId !== img.uploadId))}>
                  ×
                </button>
              </div>
            ))}
          </div>

          {/* Query */}
          <div>
            <div className="section-title">Query</div>
            <div className="query-row">
              <input
                className="query-input"
                type="text"
                value={query}
                onChange={e => setQuery(e.target.value)}
                onKeyDown={e => e.key === "Enter" && !running && runQuery()}
                placeholder="Ask a question about your satellite image(s)…"
                disabled={running}
              />
              <button className="run-btn" onClick={runQuery} disabled={running || !query.trim()}>
                {running ? "…" : "Analyse"}
              </button>
            </div>
            <div className="examples">
              {EXAMPLES.map(q => (
                <button key={q} className="ex-btn" onClick={() => setQuery(q)} disabled={running}>{q}</button>
              ))}
            </div>
          </div>

          {/* Error */}
          {error && <div className="err-text">{error}</div>}

          {/* Results */}
          <div>
            <div className="section-title">Results</div>
            <Results result={result} status={currentStatus} progress={progress} />
          </div>

        </div>

        {/* ── Map ── */}
        <div className="map-area">
          <MapView evidence={result?.evidence || null} />
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
